<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Subjects — Kid's Box 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: radial-gradient(ellipse at center, #1a1630 0%, #0a0815 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 1050px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 30px 28px 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
            min-height: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px dashed rgba(204, 93, 232, 0.4);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px rgba(204, 93, 232, 0.8);
            margin-bottom: 4px;
        }
        .header .sub {
            font-size: 14px;
            color: #b5aad0;
            letter-spacing: 2px;
        }

        /* TABS */
        .main-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 10px 18px;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.10);
            background: rgba(255, 255, 255, 0.04);
            color: #b5aad0;
            font-size: 13px;
            font-weight: 600;
            transition: 0.25s;
            font-family: inherit;
            cursor: pointer;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.10); }
        .tab-btn.active {
            background: linear-gradient(135deg, #cc5de8, #862e9c);
            border-color: #da77f2;
            color: #fff;
            box-shadow: 0 8px 30px rgba(204, 93, 232, 0.3);
        }

        /* CONTENT */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active { display: block; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

        /* TASK */
        .task {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 24px 28px;
            border-left: 4px solid #cc5de8;
            margin-bottom: 20px;
        }
        .task h2 {
            font-size: 19px;
            color: #da77f2;
            margin-bottom: 14px;
            font-weight: 700;
        }
        .task p {
            color: #cbc0d6;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        /* ============ FLASHCARDS TAB ============ */
        .flash-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }
        .flash-counter {
            font-size: 14px;
            color: #b5aad0;
            letter-spacing: 1px;
        }
        .flash-card {
            position: relative;
            width: 100%;
            max-width: 350px;
            height: 350px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            perspective: 1200px;
        }
        .flash-card.flipped { transform: rotateY(180deg); }
        .flash-side {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 24px;
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        
        .flash-front {
            background-color: #fff;
            background-image: url("subjects.jpg"); /* ИМЯ ФАЙЛА */
            background-size: 300% 300%; 
            background-repeat: no-repeat;
        }
        
        .flash-back {
            background: linear-gradient(135deg, #2a1f4a, #1a1630);
            transform: rotateY(180deg);
            border-color: rgba(218, 119, 242, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
            text-align: center;
        }
        .flash-back .flash-verb {
            font-size: 32px;
            font-weight: 800;
            color: #da77f2;
            line-height: 1.25;
            text-shadow: 0 0 20px rgba(204, 93, 232, 0.5);
            text-transform: capitalize;
            word-break: break-word; /* Чтобы длинные слова переносились */
        }
        
        .flash-card:hover .flash-side {
            box-shadow: 0 16px 50px rgba(204, 93, 232, 0.35);
        }

        .flash-controls {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 60px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.12); transform: scale(1.04); }
        .btn.green {
            background: linear-gradient(135deg, #51cf66, #2b8a3e);
            border-color: #8ce99a;
            box-shadow: 0 8px 30px rgba(81, 207, 102, 0.3);
        }

        .result {
            text-align: center;
            margin-top: 16px;
            font-size: 16px;
            font-weight: 600;
            min-height: 24px;
            color: #b5aad0;
        }
        .result.good { color: #51cf66; }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        /* ================= MEMORY GAME ================= */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 800px;
            margin: 30px auto;
            perspective: 1000px;
        }
        @media (max-width: 600px) {
            .memory-grid { gap: 8px; grid-template-columns: repeat(4, 1fr); }
        }

        .memory-card {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
        .memory-card.flipped { transform: rotateY(180deg); }
        .memory-card.matched {
            transform: rotateY(180deg);
            pointer-events: none;
        }

        .card-face {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Стили для рубашки с цифрами */
        .card-back {
            background: linear-gradient(135deg, #3b2d5c, #251a40);
            background-image: repeating-linear-gradient(45deg, rgba(204, 93, 232, 0.1) 0 10px, transparent 10px 20px);
            color: #da77f2;
            font-size: 32px;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(204, 93, 232, 0.5);
        }

        .card-front {
            background: #fff;
            transform: rotateY(180deg);
            flex-direction: column;
            padding: 0;
        }

        .card-image-wrap {
            width: 100%; height: 100%;
            background-image: url("subjects.jpg"); /* ИМЯ ФАЙЛА */
            background-size: 300% 300%;
            background-repeat: no-repeat;
        }

        .card-word {
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 16px; /* Немного уменьшили шрифт для длинных слов */
            color: #1a1630;
            text-align: center;
            font-weight: 700;
            line-height: 1.2;
            text-transform: uppercase;
            padding: 4px;
            word-break: break-word;
        }

        .memory-card.matched .card-front {
            border-color: #51cf66;
            box-shadow: 0 0 20px rgba(81, 207, 102, 0.4);
        }
        .memory-card.matched .card-word {
            color: #2b8a3e;
        }
        
        @media (max-width: 720px) {
            .app { padding: 20px 16px; border-radius: 28px; }
            .header h1 { font-size: 22px; }
            .card-word { font-size: 12px; } /* Еще меньше на мобильных */
            .flash-card { max-width: 280px; height: 280px; }
            .flash-back .flash-verb { font-size: 24px; }
            .card-back { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>📚 School Subjects</h1>
        <div class="sub">Kid's Box 3 • Vocabulary Practice</div>
    </div>

    <div class="main-tabs">
        <button class="tab-btn active" data-tab="tab-flash">🃏 Flashcards</button>
        <button class="tab-btn" data-tab="tab-game">🎮 Memory Game</button>
    </div>

    <!-- ================= TAB FLASHCARDS ================= -->
    <div id="tab-flash" class="tab-content active">
        <div class="task">
            <h2>🃏 Flashcards</h2>
            <p>Click the card to see the word. Click again to hide it.</p>
            <div class="flash-stage">
                <div class="flash-counter" id="flashCounter"></div>
                <div class="flash-card" id="flashCard">
                    <div class="flash-side flash-front" id="flashFront"></div>
                    <div class="flash-side flash-back">
                        <div class="flash-verb" id="flashVerb"></div>
                    </div>
                </div>
                <div class="flash-controls">
                    <button class="btn" onclick="prevFlashcard()">← Prev</button>
                    <button class="btn green" onclick="nextFlashcard()">Next →</button>
                    <button class="btn" onclick="shuffleFlashcards()">🔀 Shuffle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= TAB GAME: MEMORY ================= -->
    <div id="tab-game" class="tab-content">
        <div class="task">
            <h2>🎮 Memory Game: Find the Pairs</h2>
            <p>Say the numbers: <i>"I open picture eleven and picture twelve."</i></p>
            
            <div class="memory-grid" id="memoryGrid"></div>
            
            <div class="controls">
                <button class="btn green" onclick="initGame()">🔄 Restart Game</button>
            </div>
            <div class="result" id="gameResult"></div>
        </div>
    </div>

    <div class="footer-note">✧ Kid's Box 3 • School Subjects ✧</div>
</div>

<script>
    // ================= TAB SWITCHING =================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });

    // ================= SOUNDS =================
    let audioCtx = null;
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'click') { osc.frequency.value = 600; gain.gain.value = 0.05; osc.start(); osc.stop(audioCtx.currentTime + 0.08); }
            if (type === 'success') { 
                osc.frequency.value = 800; gain.gain.value = 0.08; osc.start(); 
                setTimeout(() => { osc.frequency.value = 1000; }, 100);
                osc.stop(audioCtx.currentTime + 0.25); 
            }
            if (type === 'error') { osc.frequency.value = 300; gain.gain.value = 0.08; osc.start(); osc.stop(audioCtx.currentTime + 0.15); }
        } catch(e) {}
    }

    // ================= TEXT TO SPEECH =================
    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-GB';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }
    }

    // ================= VOCAB =================
    // Координаты подобраны для сетки 3x3 на картинке subjects.jpg
    const vocab = [
        { word: 'Art',              say: 'Art',              x: 0, y: 0 },
        { word: 'Computer Studies', say: 'Computer Studies', x: 1, y: 0 },
        { word: 'English',          say: 'English',          x: 2, y: 0 },
        { word: 'French',           say: 'French',           x: 0, y: 1 },
        { word: 'Geography',        say: 'Geography',        x: 1, y: 1 },
        { word: 'History',          say: 'History',          x: 2, y: 1 },
        { word: 'Maths',            say: 'Maths',            x: 0, y: 2 },
        { word: 'Music',            say: 'Music',            x: 1, y: 2 },
        { word: 'Science',          say: 'Science',          x: 2, y: 2 }
    ];

    // ================= FLASHCARDS =================
    let flashOrder = [];
    let flashIndex = 0;

    function shuffleFlashcards() {
        flashOrder = [...vocab].sort(() => Math.random() - 0.5);
        flashIndex = 0;
        renderFlashcard();
    }

    function renderFlashcard() {
        const card = document.getElementById('flashCard');
        card.classList.remove('flipped');

        const item = flashOrder[flashIndex];
        if (!item) return;

        const posX = item.x * 50;
        const posY = item.y * 50;
        
        const front = document.getElementById('flashFront');
        front.style.backgroundPosition = `${posX}% ${posY}%`;
        
        document.getElementById('flashVerb').textContent = item.word;
        document.getElementById('flashCounter').textContent = `Card ${flashIndex + 1} of ${flashOrder.length}`;
    }

    function nextFlashcard() {
        flashIndex = (flashIndex + 1) % flashOrder.length;
        renderFlashcard();
    }

    function prevFlashcard() {
        flashIndex = (flashIndex - 1 + flashOrder.length) % flashOrder.length;
        renderFlashcard();
    }

    function setupFlashcard() {
        const card = document.getElementById('flashCard');
        card.addEventListener('click', () => {
            const item = flashOrder[flashIndex];
            if (!item) return;

            card.classList.toggle('flipped');
            
            if (card.classList.contains('flipped')) {
                playSound('click');
                speak(item.say);
            }
        });
    }

    // ================= MEMORY GAME =================
    let gamePairs = [];
    let cardsData = [];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matchedPairs = 0;

    function initGame() {
        gamePairs = [...vocab].sort(() => Math.random() - 0.5);
        
        cardsData = [];
        gamePairs.forEach((item, index) => {
            cardsData.push({ id: index, type: 'image', data: item });
            cardsData.push({ id: index, type: 'word', data: item });
        });
        
        // Перемешиваем карточки
        cardsData.sort(() => Math.random() - 0.5);
        
        // Присваиваем номера от 11 до 28
        cardsData.forEach((card, index) => {
            card.displayNumber = index + 11; 
        });
        
        firstCard = null;
        secondCard = null;
        lockBoard = false;
        matchedPairs = 0;
        
        document.getElementById('gameResult').textContent = '';
        document.getElementById('gameResult').className = 'result';
        renderBoard();
    }

    function renderBoard() {
        const grid = document.getElementById('memoryGrid');
        grid.innerHTML = '';
        
        cardsData.forEach((card, index) => {
            const cardEl = document.createElement('div');
            cardEl.className = 'memory-card';
            cardEl.dataset.index = index;
            
            if (card.type === 'image') {
                const posX = card.data.x * 50;
                const posY = card.data.y * 50;
                cardEl.innerHTML = `
                    <div class="card-face card-back">${card.displayNumber}</div>
                    <div class="card-face card-front">
                        <div class="card-image-wrap" style="background-position: ${posX}% ${posY}%;"></div>
                    </div>
                `;
            } else {
                cardEl.innerHTML = `
                    <div class="card-face card-back">${card.displayNumber}</div>
                    <div class="card-face card-front">
                        <div class="card-word">${card.data.word}</div>
                    </div>
                `;
            }
            
            cardEl.addEventListener('click', () => flipCard(cardEl, card));
            grid.appendChild(cardEl);
        });
    }

    function flipCard(cardEl, card) {
        if (lockBoard) return;
        if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
        
        playSound('click');
        cardEl.classList.add('flipped');
        
        if (!firstCard) {
            firstCard = { el: cardEl, data: card };
        } else {
            secondCard = { el: cardEl, data: card };
            checkMatch();
        }
    }

    function checkMatch() {
        const isMatch = (firstCard.data.id === secondCard.data.id) && (firstCard.data.type !== secondCard.data.type);
        
        if (isMatch) {
            firstCard.el.classList.add('matched');
            secondCard.el.classList.add('matched');
            
            speak(firstCard.data.data.say);
            playSound('success');
            
            matchedPairs++;
            resetBoard();
            
            if (matchedPairs === gamePairs.length) {
                document.getElementById('gameResult').textContent = "🎉 Perfect! All pairs found!";
                document.getElementById('gameResult').className = "result good";
            }
        } else {
            lockBoard = true;
            playSound('error');
            setTimeout(() => {
                firstCard.el.classList.remove('flipped');
                secondCard.el.classList.remove('flipped');
                resetBoard();
            }, 1200);
        }
    }

    function resetBoard() {
        firstCard = null;
        secondCard = null;
        lockBoard = false;
    }

    // ================= INIT =================
    setupFlashcard();
    shuffleFlashcards();
    initGame();

</script>

</body>
</html>
